<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>动画生成 - Neon Orbital</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <p class="eyebrow">灵感来源</p>
        <h1>以浏览器重现 YouTube 动画</h1>
        <p class="lede">
          打开页面即可看到漂浮的霓虹光球在中心环绕、呼吸与交错，形成类似视频
          <span class="chip">rFV7wdEX-Mo</span> 的节奏感动态。所有动画由 Canvas 实时绘制，可随时暂停、调整速度或切换色彩主题。
        </p>
        <div class="controls">
          <button id="toggle">暂停</button>
          <button id="reset">重置</button>
          <label class="inline">
            速度
            <input id="speed" type="range" min="0.1" max="2.5" step="0.05" value="1" />
          </label>
          <label class="inline">
            主题
            <select id="theme">
              <option value="aurora">极光</option>
              <option value="sunset">暮色</option>
              <option value="electric">电光</option>
              <option value="mono">冷白</option>
            </select>
          </label>
        </div>
      </div>
      <div class="badge">HTML5 Canvas</div>
    </header>

    <section class="canvas-wrap">
      <canvas id="scene" aria-label="霓虹环绕动画"></canvas>
    </section>

    <section class="how">
      <h2>玩法与调整</h2>
      <ol>
        <li>点击<b>暂停</b>快速对比静止帧，或重新播放观察轨迹。</li>
        <li>拖动<b>速度</b>滑块，放慢观察细节或加快律动。</li>
        <li>选择不同<b>主题</b>获取色彩风格：极光、暮色、电光或冷白。</li>
        <li>窗口大小变化会自动适配分辨率，保持平滑帧率。</li>
      </ol>
    </section>
  </main>

  <footer class="footer">
    <p>Canvas 实时渲染 · 可离线运行 · 没有第三方依赖</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
